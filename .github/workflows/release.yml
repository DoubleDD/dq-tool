# 打 tag(如 v1.0)触发:构建安装包并附加到 GitHub Release
#   当前启用:Windows x64 jpackage 免安装 zip(server,浏览器 --app 模式)+ windows-tauri NSIS 安装包;
#   windows-shell(JCEF)暂时注释停用(2026-08 起,随 tauri 一并停用,恢复时需验证);
#   Windows ARM64 / macOS dmg / Linux deb+rpm 同样注释停用,需要时取消注释即可
# 也可在 Actions 页面手动触发(workflow_dispatch),产物以 artifact 形式下载
name: release

permissions:
  contents: write   # 挂 Release 附件需要

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build portable zip
        run: scripts\package-win.bat

      # 统一命名: dq-tool-<版本>-<系统>-<架构>.zip
      - name: Rename zip with platform suffix
        id: pkg
        shell: pwsh
        run: |
          cd server/build/jpackage/dist
          Get-ChildItem dq-tool-*.zip | Rename-Item -NewName { $_.Name -replace '\.zip$', '-windows-x64.zip' }
          # 产物名(不含扩展名)传给 upload-artifact,让手动触发时下载的 artifact 也带版本号
          "name=$((Get-ChildItem dq-tool-*.zip | Select-Object -First 1).BaseName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: server/build/jpackage/dist/*.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: server/build/jpackage/dist/*.zip

