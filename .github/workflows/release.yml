# 打 tag(如 v1.0)触发:全平台构建安装包并附加到 GitHub Release
#   Windows → 免安装 zip,macOS → dmg(arm64 + x86_64),Linux → deb
# 也可在 Actions 页面手动触发(workflow_dispatch),产物以 artifact 形式下载
name: release

permissions:
  contents: write   # 挂 Release 附件需要

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build portable zip
        run: scripts\package-win.bat

      # 统一命名: dq-tool-<版本>-<系统>-<架构>.zip
      - name: Rename zip with platform suffix
        shell: pwsh
        run: |
          cd target/jpackage/dist
          Get-ChildItem dq-tool-*.zip | Rename-Item -NewName { $_.Name -replace '\.zip$', '-windows-x64.zip' }

      - uses: actions/upload-artifact@v7
        with:
          name: dq-tool-windows-x64
          path: target/jpackage/dist/*.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/jpackage/dist/*.zip

  windows-arm:
    # ARM64 Windows;Temurin 不出 Windows ARM64 的 JDK,用 Microsoft OpenJDK
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          architecture: aarch64
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build portable zip
        run: scripts\package-win.bat

      # 统一命名: dq-tool-<版本>-<系统>-<架构>.zip
      - name: Rename zip with platform suffix
        shell: pwsh
        run: |
          cd target/jpackage/dist
          Get-ChildItem dq-tool-*.zip | Rename-Item -NewName { $_.Name -replace '\.zip$', '-windows-arm64.zip' }

      - uses: actions/upload-artifact@v7
        with:
          name: dq-tool-windows-arm64
          path: target/jpackage/dist/*.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/jpackage/dist/*.zip

  macos:
    # jpackage 不能交叉编译,Apple Silicon 和 Intel 分别在对应架构的 runner 上构建
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }         # Apple Silicon
          - { os: macos-15-intel, arch: x86_64 }  # Intel(macos-13 已于 2025-12 退役,此为替代标签,支持到 2027-08)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build dmg
        run: scripts/package-mac.sh

      # 统一命名: dq-tool-<版本>-macos-<架构>.dmg
      - name: Rename dmg with platform suffix
        run: |
          cd target/jpackage/dist
          for f in dq-tool-*.dmg; do mv "$f" "${f%.dmg}-macos-${{ matrix.arch }}.dmg"; done

      - uses: actions/upload-artifact@v7
        with:
          name: dq-tool-macos-dmg-${{ matrix.arch }}
          path: target/jpackage/dist/*.dmg
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/jpackage/dist/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # jpackage 打 deb 需要 fakeroot
      - name: Install fakeroot
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build deb installer
        run: scripts/package-linux.sh

      # 统一命名: dq-tool-<版本>-linux-amd64.deb(deb 原生命名为 dq-tool_<版本>_amd64.deb)
      - name: Rename deb with platform suffix
        run: |
          cd target/jpackage/dist
          for f in dq-tool_*.deb; do
            v=$(echo "$f" | sed -E 's/dq-tool_(.*)_amd64\.deb/\1/')
            mv "$f" "dq-tool-${v}-linux-amd64.deb"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dq-tool-linux-deb
          path: target/jpackage/dist/*.deb
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/jpackage/dist/*.deb
