  windows-tauri:
    # Tauri 2 套壳版(系统 WebView + Rust 侧车拉起 java 子进程)NSIS 安装包;
    # 内嵌 fat jar + 完整 JRE(tauri/src-tauri/resources/,由打包脚本组装)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      # windows-latest 镜像自带 Rust stable;缓存 cargo 产物加速重复构建
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      # 前端依赖(打包脚本要跑 web 的 npm run build)
      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install tauri dependencies
        run: npm ci
        working-directory: tauri

      # 自动更新签名私钥直接入库(scripts/updater-private.key,单行 base64,无密码;
      # 分发方多机打包需要,见 tauri/AGENTS.md),注入环境变量供 tauri CLI 给 updater 产物签名
      - name: Load updater signing key
        shell: pwsh
        run: "TAURI_SIGNING_PRIVATE_KEY=$(Get-Content -Raw scripts/updater-private.key) >> $env:GITHUB_ENV"

      # 用 cmd 跑 .bat:pwsh 步骤默认不检查 $LASTEXITCODE,批处理失败会被静默吞掉
      - name: Build NSIS installer
        shell: cmd
        run: scripts\package-tauri-win.bat

      # 统一命名: dq-tool-<版本>-<系统>-<架构>-setup.exe(tauri 产物原名 dq-tool_<版本>_x64-setup.exe)
      - name: Rename installer with platform suffix
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          cd tauri/src-tauri/target/release/bundle/nsis
          Rename-Item "dq-tool_${v}_x64-setup.exe" "dq-tool-$v-windows-x64-setup.exe"
          "name=dq-tool-$v-windows-x64-setup" >> $env:GITHUB_OUTPUT

      # 自动更新产物:重命名 .nsis.zip(updater 实际下载的是它,不是 setup.exe)并生成 latest.json 静态清单;
      # latest.json 固定文件名,应用内 updater 经 /releases/latest/download/latest.json 永远拿到最新版信息
      - name: Prepare updater artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          cd tauri/src-tauri/target/release/bundle/nsis
          Rename-Item "dq-tool_${v}_x64-setup.nsis.zip" "dq-tool-$v-windows-x64-setup.nsis.zip"
          $sig = (Get-Content "dq-tool_${v}_x64-setup.nsis.zip.sig" -Raw).Trim()
          $latest = @{
            version = $v
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $sig
                url = "https://github.com/DoubleDD/dq-tool/releases/download/$tag/dq-tool-$v-windows-x64-setup.nsis.zip"
              }
            }
          }
          ($latest | ConvertTo-Json -Depth 5) | Set-Content -Encoding utf8 latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/nsis/*.nsis.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/nsis/*.nsis.zip
            tauri/src-tauri/target/release/bundle/nsis/latest.json

