[versions]
# testcontainers 显式钉 1.21.4:1.20.x 默认 API 1.32 被 Docker 29+ 拒绝(最低 1.40),1.21.4 起修复;
# 不随 Spring Boot 4.1 BOM 管理的 2.x 走(模块坐标有变化),server/desktop 保持一致
testcontainers = "1.21.4"
h2 = "2.3.232"
poi = "5.3.0"
mysql = "9.3.0"
postgresql = "42.7.5"
mssql = "12.10.2.jre11"
oracle = "23.26.3.0.0"
dameng = "8.1.3.140"
kingbase = "9.0.1"
oceanbase = "2.4.18"

[libraries]
h2 = { group = "com.h2database", name = "h2", version.ref = "h2" }
poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "poi" }
jdbc-mysql = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysql" }
jdbc-postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
jdbc-mssql = { group = "com.microsoft.sqlserver", name = "mssql-jdbc", version.ref = "mssql" }
jdbc-oracle = { group = "com.oracle.database.jdbc", name = "ojdbc11", version.ref = "oracle" }
# orai18n:23c 起 ojdbc 移除了部分 NLS 字符集支持,Oracle 老库(ZHS16GBK 等)连接需要,否则报 ORA-17056
jdbc-oracle-nls = { group = "com.oracle.database.nls", name = "orai18n", version.ref = "oracle" }
jdbc-dameng = { group = "com.dameng", name = "DmJdbcDriver18", version.ref = "dameng" }
jdbc-kingbase = { group = "cn.com.kingbase", name = "kingbase8", version.ref = "kingbase" }
jdbc-oceanbase = { group = "com.oceanbase", name = "oceanbase-client", version.ref = "oceanbase" }
testcontainers-junit = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }
testcontainers-mysql = { group = "org.testcontainers", name = "mysql", version.ref = "testcontainers" }
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-mssqlserver = { group = "org.testcontainers", name = "mssqlserver", version.ref = "testcontainers" }
