<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据质量检测工具</title>
    <script>
      // 应用挂载前恢复主题,避免深色用户首帧白闪(与 stores/theme.js 的存储键一致)
      if (localStorage.getItem('dq-theme') === 'dark') document.documentElement.classList.add('dark')
    </script>
    <style>
      /* 挂载前占位(后端就绪探针 /api/health 返回 200 前):静态外壳秒出,避免白屏;Vue 挂载后自动替换 */
      .boot-loading {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; height: 100vh; color: #909399; font-size: 14px; font-family: system-ui, sans-serif;
      }
      .boot-loading-spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(64, 158, 255, .25); border-top-color: #409eff;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading">
        <div class="boot-loading-spinner"></div>
        <div class="boot-loading-text">正在连接服务…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
