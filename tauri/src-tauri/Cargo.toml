[package]
name = "dq-tool-tauri"
version = "0.1.0"
description = "dq-tool 的 Tauri 2 桌面壳"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 侧车拉起/端口探测/就绪轮询全部用 std 实现;libc 仅 Unix 用于 Ctrl+C/SIGTERM 兜底杀子进程
tauri = { version = "2", features = ["tray-icon"] }
# 自动更新(GitHub Releases 静态清单 + minisign 验签)与原生询问对话框(更新确认弹窗)
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# generate_context! 宏在 tauri.conf.json 带 plugins 段时需要本 crate 直接依赖 serde_json
serde_json = "1"
tauri-plugin-single-instance = "2"
# 通用下载「另存为」:Rust 侧 GET 本地后端流式导出接口(产物不落盘,只能自己发请求);
# 阻塞式 API,不引 async runtime
ureq = "3"
# 浏览器访问管控 token 生成(每次启动随机 16 字节);Cargo.lock 已有 0.4.x 传递依赖,复用不增新条目
getrandom = "0.4"
# 业务层(versions/ 下的 jar + 前端)在线更新与 dq 自定义协议所需:
# 业务更新清单(business-latest.json)反序列化
serde = { version = "1", features = ["derive"] }
# minisign 验签(与 tauri-plugin-updater 同一把公钥、同一算法);Cargo.lock 已有 0.2.5 传递依赖
minisign-verify = "0.2"
# 验签前对公钥/签名做 base64 解码(同 updater 内部 verify_signature 的做法);0.22 与 updater 锁定版本一致
base64 = "0.22"
# 业务更新包解压;复用 tauri-plugin-updater 已锁定的 4.6.1(原计划 zip 2.x,锁文件里已是 4.x,避免双版本)
zip = { version = "4", default-features = false, features = ["deflate"] }
# dq 协议按文件扩展名给 Content-Type
mime_guess = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# tauri 的默认特性集(自定义协议等)在本壳里用不到,保持最小
default = []
