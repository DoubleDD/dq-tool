[package]
name = "dq-tool-tauri"
version = "0.1.0"
description = "dq-tool 的 Tauri 2 桌面壳"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 侧车拉起/端口探测/就绪轮询全部用 std 实现;libc 仅 Unix 用于 Ctrl+C/SIGTERM 兜底杀子进程
tauri = { version = "2", features = ["tray-icon"] }
# 自动更新(GitHub Releases 静态清单 + minisign 验签)与原生询问对话框(更新确认弹窗)
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# generate_context! 宏在 tauri.conf.json 带 plugins 段时需要本 crate 直接依赖 serde_json
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# tauri 的默认特性集(自定义协议等)在本壳里用不到,保持最小
default = []
